name: Production Deploy

on:
  push:
    branches:
      - main

jobs:
  version:
    name: Determine Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semver.outputs.version }}
      tag: ${{ steps.semver.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest tag
        id: get-latest-tag
        run: |
          git fetch --tags
          LATEST_TAG=$(git tag --sort=-v:refname | head -n 1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v0.0.0"
          fi
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "Latest tag: $LATEST_TAG"

      - name: Determine version bump
        id: semver
        run: |
          LATEST_TAG="${{ steps.get-latest-tag.outputs.latest_tag }}"

          # Remove 'v' prefix for calculation
          CURRENT_VERSION=${LATEST_TAG#v}

          # Split version into parts
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          # Get commit messages since last tag
          COMMITS=$(git log ${LATEST_TAG}..HEAD --pretty=format:"%s" 2>/dev/null || echo "")

          # Determine bump type based on commit messages
          # BREAKING CHANGE or major: -> major bump
          # feat: or feature: -> minor bump
          # fix: or bugfix: or patch: -> patch bump
          # default -> patch bump

          if echo "$COMMITS" | grep -qiE "^(BREAKING CHANGE|major:)"; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
            BUMP_TYPE="major"
          elif echo "$COMMITS" | grep -qiE "^(feat:|feature:)"; then
            MINOR=$((MINOR + 1))
            PATCH=0
            BUMP_TYPE="minor"
          else
            PATCH=$((PATCH + 1))
            BUMP_TYPE="patch"
          fi

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          NEW_TAG="v${NEW_VERSION}"

          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "bump_type=$BUMP_TYPE" >> $GITHUB_OUTPUT
          echo "New version: $NEW_TAG (${BUMP_TYPE} bump)"

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: version

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run linter
        run: bun run lint

      - name: Type check
        run: bun x tsc --noEmit

      - name: Install Vercel CLI
        run: bun install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          NEXT_PUBLIC_APP_VERSION: ${{ needs.version.outputs.tag }}

      - name: Deploy to Vercel Production
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> $GITHUB_OUTPUT

      - name: Create Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a ${{ needs.version.outputs.tag }} -m "Release ${{ needs.version.outputs.tag }}"
          git push origin ${{ needs.version.outputs.tag }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [version, deploy]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get previous tag
        id: prev-tag
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | sed -n 2p)
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG=$(git rev-list --max-parents=0 HEAD)
          fi
          echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG="${{ steps.prev-tag.outputs.prev_tag }}"
          NEW_TAG="${{ needs.version.outputs.tag }}"

          echo "## What's Changed" > CHANGELOG.md
          echo "" >> CHANGELOG.md

          # Group commits by type
          git log ${PREV_TAG}..HEAD --pretty=format:"%s" --reverse | while read -r commit; do
            case "$commit" in
              feat:*|feature:*)
                TYPE="✨ Features"
                MSG="${commit#*: }"
                ;;
              fix:*|bugfix:*)
                TYPE="🐛 Bug Fixes"
                MSG="${commit#*: }"
                ;;
              docs:*)
                TYPE="📚 Documentation"
                MSG="${commit#*: }"
                ;;
              style:*)
                TYPE="💄 Style"
                MSG="${commit#*: }"
                ;;
              refactor:*)
                TYPE="♻️ Refactoring"
                MSG="${commit#*: }"
                ;;
              perf:*)
                TYPE="⚡ Performance"
                MSG="${commit#*: }"
                ;;
              test:*)
                TYPE="✅ Tests"
                MSG="${commit#*: }"
                ;;
              chore:*)
                TYPE="🔧 Chores"
                MSG="${commit#*: }"
                ;;
              *)
                TYPE="📦 Other Changes"
                MSG="$commit"
                ;;
            esac
            echo "- **$TYPE**: $MSG" >> CHANGELOG.md
          done

          echo "" >> CHANGELOG.md
          echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${NEW_TAG}" >> CHANGELOG.md

          cat CHANGELOG.md

      - name: Create Release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');

            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: '${{ needs.version.outputs.tag }}',
              name: 'Release ${{ needs.version.outputs.tag }}',
              body: changelog,
              draft: false,
              prerelease: false
            });
